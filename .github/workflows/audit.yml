# Runs the standard audit (docs/development.md § Audits, D-016) on every push and pull request, and
# the test suite on Linux, macOS and Windows under each tested Node.js major (D-049, D-094).
# Real session logs never exist in CI, so real-log checks stay local (docs/development.md § Testing).
name: audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Pinned to the version used locally so A10 behaves identically in both places.
      GITLEAKS_VERSION: 8.30.1
      # The release archive's own checksum, recorded here so a re-uploaded release can't pass.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: check A10a scans every commit, not just the tip.
          fetch-depth: 0
          # Don't leave the job's token in .git/config while other steps run.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          # The independent reference implementation (D-017) runs on Python 3.
          python-version: "3.12"

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          # Check against the checksum recorded above, not one fetched beside the archive: whoever
          # could replace the archive could replace that file too.
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$archive"

      - name: Install dependencies
        # .npmrc sets ignore-scripts, so no dependency runs code at install time; the database is
        # Node's built-in node:sqlite (D-093), so nothing needs one.
        run: npm ci

      - name: Audit
        run: npm run audit

  tests:
    # The full audit needs Python, gitleaks, and shellcheck, so it runs on Linux above. The test suite
    # runs everywhere Nilometer is supported, under every Node.js major it's tested on
    # (TESTED_NODE_MAJORS in core/util/node-version.ts; a test keeps the two in step). Each major
    # bundles its own SQLite, which is what broke on Node 26 (D-094). On Windows, Git Bash provides
    # `sh` on PATH (D-049).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "26"]
        exclude:
          # The audit job above already runs the suite on Linux under .nvmrc's Node 24.
          - os: ubuntu-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx vitest run

  install:
    # The packed tarball, installed as a user would in an empty home: init, a status line reading, the
    # package removed (the hook must still record, D-056), ingest, report, and an uninstall that must
    # leave settings.json byte-identical (G5.4). It uses the network: npm fetches the dependency.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        # npm run build explicitly: .npmrc's ignore-scripts turns off prepack (G5.3).
        run: |
          npm run build
          npm pack --ignore-scripts

      - name: Install rehearsal
        run: npx tsx scripts/install/rehearse.cli.ts nilometer-*.tgz
